name: npm preflight (never auto-publish)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Node package and negative security tests
        run: npm test
      - name: Pack and locally install in isolated project
        run: npm run test:npm-pack
      - name: Require genuine native compiler/relational Zig evidence
        run: npm run qualify:native-e2e
      - name: Report publication status without publishing
        run: echo 'Public npm publication requires approved verified native artifacts, legal license, and authenticated npm publisher.'
