name: NoeSQL .noedb session integration
on:
  push:
    branches: [integration/ecosystem-v1]
  pull_request:
    branches: [main]
jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test tests/noesql-session.test.mjs tests/noesql-migrate-noedb.test.mjs
