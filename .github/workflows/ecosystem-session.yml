name: NoeSQL .noedb session integration

on:
  push:
    branches: [main, refactor/no-cpp-noqeri-rust-zig, feat/noesql-mvcc-security-types-20261026]
  pull_request:
    branches: [main, fix/stress-concurrent-cli-20261026, feat/noesql-release-qualification-20261026]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: noesql-session-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  session:
    name: Rust session + Zig durability
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Source tree guard
        run: make no-js no-c-family

      - name: Run native session validation
        run: bash scripts/verify-ecosystem-local.sh

      - name: Test .noeqr REST API with real CLI
        run: make test-noeqr-rest-local

      - name: Build Zig storage library
        run: zig build --build-file Native/zig/build.zig --prefix Native/zig/zig-out -Doptimize=ReleaseSafe

      - name: Test Rust session snapshot cold-reopen through Zig
        env:
          NOESQL_ZIG_LIB_DIR: ${{ github.workspace }}/Native/zig/zig-out/lib
        run: cargo test --locked --manifest-path Native/rust/Cargo.toml --all-targets --features zig-pager
