name: NoeSQL .noedb session integration
on:
  push:
    branches: [refactor/no-js-rust-zig-runtime, refactor/noqeri-zig-rust-only, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native toolchain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
      - name: Enforce NoeSQL source stack
        run: make no-js no-native-c-family
      - name: Execute local native verification
        run: bash scripts/verify-ecosystem-local.sh
