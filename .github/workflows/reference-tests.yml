name: NoeSQL reference tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  node-tests:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run reference and security regression tests
        run: npm test

  native-cpp:
    name: Native C++ compatibility and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install native headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libsqlite3-dev
      - name: Compile and run native fault, ABI and durability tests
        run: make -C Native/cpp test
      - name: Validate corrected SQLite benchmark harness
        run: make -C Native/cpp benchmark-compare

  zig:
    name: Zig 0.15.2 bridge and legacy verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Build and test native Zig verification components
        run: npm run test:zig
      - name: ReleaseSafe build
        run: npm run build:zig
      - name: Verify Zig C ABI declarations compile
        run: cc -std=c11 -Wall -Wextra -Werror -fsyntax-only -I Native/zig -x c Native/zig/noesql_zig_pages.h
      - name: Verify Noqeri proof checker rejects missing provenance
        run: |
          if npm run verify:noqeri; then
            echo "Fail-closed provenance gate unexpectedly passed without any pinned compiler" >&2
            exit 1
          fi

