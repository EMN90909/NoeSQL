name: NoeSQL native validation

on:
  push:
    branches: [main, refactor/no-js-rust-zig-runtime]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    name: Noqeri + C++ + Rust + Zig
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libsqlite3-dev

      - name: Reject JavaScript regression
        run: make no-js

      - name: Run complete native test matrix
        run: zig build test

      - name: Build release-safe native components
        run: zig build native

      - name: Validate C ABI headers
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsyntax-only -I Native/zig -x c Native/zig/noesql_zig_pages.h
          cc -std=c11 -Wall -Wextra -Werror -fsyntax-only -I Native/cpp -x c Native/cpp/noesql_engine_abi.h
          cc -std=c11 -Wall -Wextra -Werror -fsyntax-only -I Native/cpp -x c Native/cpp/noesql_session_abi.h

      - name: Rust hygiene
        run: |
          cargo fmt --manifest-path Native/rust/Cargo.toml -- --check
          cargo clippy --manifest-path Native/rust/Cargo.toml --all-targets -- -D warnings
