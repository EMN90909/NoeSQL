name: NoeSQL native validation

on:
  push:
    branches: [main, refactor/no-cpp-noqeri-rust-zig]
  pull_request:
    branches: [main, fix/stress-concurrent-cli-20261026, feat/noesql-release-qualification-20261026]
  workflow_dispatch:
  workflow_call:
    secrets:
      NOQERI_READ_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: noesql-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Noqeri + Rust + Zig
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev libsqlite3-dev

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Record toolchain provenance
        run: |
          zig version
          rustc --version
          cargo --version
          cc --version
          cmake --version

      - name: Enforce source stack
        run: make no-js no-c-family

      - name: Rust reference/runtime tests
        run: cargo test --locked --manifest-path Native/rust/Cargo.toml --all-targets

      - name: Zig WAL/page/index corruption and recovery tests
        run: zig build --build-file Native/zig/build.zig --prefix Native/zig/zig-out test -Doptimize=Debug

      - name: Zig ReleaseSafe library build
        run: zig build --build-file Native/zig/build.zig --prefix Native/zig/zig-out -Doptimize=ReleaseSafe

      - name: Rust -> Zig snapshot durability tests
        env:
          NOESQL_ZIG_LIB_DIR: ${{ github.workspace }}/Native/zig/zig-out/lib
        run: cargo test --locked --manifest-path Native/rust/Cargo.toml --all-targets --features zig-pager

      - name: Checkout pinned Noqeri compiler source
        uses: actions/checkout@v4
        with:
          repository: EMN90909/Noqeri
          ref: 4842fa34dc06afe39b4ba216b52c8ec7bb576984
          # Default GITHUB_TOKEN cannot necessarily read another private repo.
          # The optional read-only secret must be configured when needed.
          token: ${{ secrets.NOQERI_READ_TOKEN || github.token }}
          path: .ci-noqeri
          persist-credentials: false

      - name: Build Stage-0 compiler and NQRI VM
        run: |
          cmake -S .ci-noqeri -B .ci-noqeri-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DNOQERI_GRAPHICS_PORTABLE_BUILD=ON
          cmake --build .ci-noqeri-build --target noqeri noqeri-nqri --parallel 2
          .ci-noqeri-build/noqeri version
          .ci-noqeri-build/noqeri-nqri --selftest

      - name: Verify Stage-2/Stage-3 compiler bootstrap
        run: |
          test "$(sha256sum .ci-noqeri/Compiler/selfhost/trusted-stage1.nqri | awk '{print $1}')" = \
            "$(awk '{print $1}' .ci-noqeri/Compiler/selfhost/trusted-stage1.sha256)"
          .ci-noqeri-build/noqeri-nqri compile-manifest \
            .ci-noqeri/Compiler/selfhost/trusted-stage1.nqri \
            .ci-noqeri \
            .ci-noqeri/Compiler/selfhost/stage2-sources.txt \
            /tmp/noqeri-stage2.nqri 3
          .ci-noqeri-build/noqeri-nqri compile-manifest \
            /tmp/noqeri-stage2.nqri \
            .ci-noqeri \
            .ci-noqeri/Compiler/selfhost/stage2-sources.txt \
            /tmp/noqeri-stage3.nqri 3
          .ci-noqeri-build/noqeri-nqri diff /tmp/noqeri-stage2.nqri /tmp/noqeri-stage3.nqri
          .ci-noqeri-build/noqeri-nqri has-export /tmp/noqeri-stage2.nqri stage2CompileToNqri

      - name: Compile NoeSQL Stage-2 semantic module
        run: |
          mkdir -p Native/rust/native-stage2
          .ci-noqeri-build/noqeri-nqri compile \
            /tmp/noqeri-stage2.nqri \
            Database/noesql_stage2_bridge.noqeri \
            Native/rust/native-stage2/noesql_stage2_bridge.nqri 3
          .ci-noqeri-build/noqeri-nqri has-export \
            Native/rust/native-stage2/noesql_stage2_bridge.nqri \
            noesqlStage2BoolRow

      - name: Execute Rust -> Stage-2 NQRI -> Zig
        env:
          NOESQL_ZIG_LIB_DIR: ${{ github.workspace }}/Native/zig/zig-out/lib
          NOESQL_NQRI_VM: ${{ github.workspace }}/.ci-noqeri-build/noqeri-nqri
          NOESQL_STAGE2_MODULE: ${{ github.workspace }}/Native/rust/native-stage2/noesql_stage2_bridge.nqri
        run: |
          cargo test --locked --manifest-path Native/rust/Cargo.toml --all-targets --features stage2-nqri
          cargo run --locked --manifest-path Native/rust/Cargo.toml --features stage2-nqri --bin stage2_chain_smoke

      - name: Build native Noqeri AOT archive
        run: |
          cargo run --locked --manifest-path Native/rust/Cargo.toml --bin build_native -- \
            "$GITHUB_WORKSPACE/.ci-noqeri-build/noqeri" \
            "$GITHUB_WORKSPACE/Database/noesql_native_bridge.noqeri" \
            "$GITHUB_WORKSPACE/Native/rust/native-lib"
          test -s Native/rust/native-lib/libnoesql_noqeri.a

      - name: Execute Rust -> Noqeri AOT -> Zig
        env:
          NOESQL_NOQERI_LIB_DIR: ${{ github.workspace }}/Native/rust/native-lib
          NOESQL_ZIG_LIB_DIR: ${{ github.workspace }}/Native/zig/zig-out/lib
        run: |
          cargo test --locked --manifest-path Native/rust/Cargo.toml --all-targets --features noqeri-native
          cargo run --locked --manifest-path Native/rust/Cargo.toml --features noqeri-native --bin native_chain_smoke

      - name: Benchmark Noqeri AOT vs SQLite WAL with correctness verification
        env:
          NOESQL_NOQERI_LIB_DIR: ${{ github.workspace }}/Native/rust/native-lib
          NOESQL_ZIG_LIB_DIR: ${{ github.workspace }}/Native/zig/zig-out/lib
        run: |
          cargo run --release --locked --manifest-path Native/rust/Cargo.toml \
            --features noqeri-native --bin benchmark_compare_sqlite \
            | tee native-sqlite-benchmark.txt

      - name: Preserve benchmark output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-sqlite-benchmark
          path: native-sqlite-benchmark.txt
          if-no-files-found: ignore

      - name: Cross-mode native/Stage-2 compatibility test
        env:
          NOESQL_NOQERI_LIB_DIR: ${{ github.workspace }}/Native/rust/native-lib
          NOESQL_ZIG_LIB_DIR: ${{ github.workspace }}/Native/zig/zig-out/lib
          NOESQL_NQRI_VM: ${{ github.workspace }}/.ci-noqeri-build/noqeri-nqri
          NOESQL_STAGE2_MODULE: ${{ github.workspace }}/Native/rust/native-stage2/noesql_stage2_bridge.nqri
        run: |
          cargo test --locked --manifest-path Native/rust/Cargo.toml \
            --test native_cross_mode --features noqeri-native,stage2-nqri

      - name: Repeat Zig and Rust durability/corruption suites three times
        env:
          NOESQL_ZIG_LIB_DIR: ${{ github.workspace }}/Native/zig/zig-out/lib
        run: make stress

      - name: Final repository source contract
        run: make no-js no-c-family
