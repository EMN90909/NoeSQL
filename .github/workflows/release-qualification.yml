name: NoeSQL release qualification

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noesql-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    uses: ./.github/workflows/reference-tests.yml
    permissions:
      contents: read

  session:
    uses: ./.github/workflows/ecosystem-session.yml
    permissions:
      contents: read

  release-gate:
    name: release-gate
    needs: [native, session]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Reject skipped, failed or cancelled qualifications
        env:
          NATIVE_RESULT: ${{ needs.native.result }}
          SESSION_RESULT: ${{ needs.session.result }}
        run: |
          set -eu
          test "$NATIVE_RESULT" = success
          test "$SESSION_RESULT" = success

      - uses: actions/checkout@v4

      - name: Confirm release provenance and version consistency
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          version="$(tr -d '\r\n ' < VERSION)"
          test -n "$version"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          git diff --exit-code
          test -s Native/rust/Cargo.lock
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "version=$version"
            sha256sum Native/rust/Cargo.lock
          } > noesql-release-attestation.txt

      - name: Preserve qualification receipt only after passing all gates
        uses: actions/upload-artifact@v4
        with:
          name: noesql-release-attestation
          path: noesql-release-attestation.txt
          if-no-files-found: error
          retention-days: 90
