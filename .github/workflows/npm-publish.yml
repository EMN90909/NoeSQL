name: Publish NoeSQL (owner approval and OIDC)
on:
  workflow_dispatch:
    inputs:
      reviewed_commit:
        description: Exact reviewed main commit (40 hex chars)
        required: true
        type: string
      confirm:
        description: Type publish-noesql@0.7.6 after all native and legal gates
        required: true
        type: string
      native_artifact_run:
        description: Reviewed NoeSQL GitHub Actions run with native toolchain artifact
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'publish-noesql@0.7.6'
    environment: npm-public-release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify reviewed main commit
        env:
          REVIEWED: ${{ inputs.reviewed_commit }}
        run: |
          [[ "$REVIEWED" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REVIEWED"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      # Artifacts must be produced by a prior, owner-reviewed build run.
      # A GitHub environment variable naming a runner filesystem path is NOT
      # an artifact: download exact bits and verify their pinned SHA-256 in preflight.
      - uses: actions/checkout@v4
        with:
          repository: EMN90909/Noqeri
          ref: ${{ vars.NOQERI_COMMIT_SHA }}
          path: .ci-noqeri
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: noqeri-native-qualified
          run-id: ${{ inputs.native_artifact_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native-approved
      - name: Stage independently reviewed Noqeri compiler proof
        env:
          ARTIFACT: ${{ runner.temp }}/native-approved
        run: |
          test -s "$ARTIFACT/noqeri-stage0"
          test -s "$ARTIFACT/noqeri-native-compiler"
          test -s "$ARTIFACT/noesql-native"
          test -s "$ARTIFACT/noqeri-build/stage2-proof.json"
          mkdir -p .ci-noqeri/build
          cp -a "$ARTIFACT/noqeri-build/." .ci-noqeri/build/
          chmod 0700 "$ARTIFACT/noqeri-stage0" "$ARTIFACT/noqeri-native-compiler" "$ARTIFACT/noesql-native"
      - name: Verify pinned Noqeri compiler, Zig relational integration, tests and legal review
        env:
          NOESQL_APPROVE_PUBLICATION: ${{ inputs.confirm }}
          NOESQL_APPROVED_COMMIT_SHA: ${{ inputs.reviewed_commit }}
          NOESQL_LICENSE_REVIEWED: ${{ vars.NOESQL_LICENSE_REVIEWED }}
          NOQERI_ROOT: ${{ github.workspace }}/.ci-noqeri
          NOQERI_COMMIT_SHA: ${{ vars.NOQERI_COMMIT_SHA }}
          NOQERI_SOURCE_CLOSURE_SHA256: ${{ vars.NOQERI_SOURCE_CLOSURE_SHA256 }}
          NOQERI_STAGE0: ${{ runner.temp }}/native-approved/noqeri-stage0
          NOQERI_STAGE0_SHA256: ${{ vars.NOQERI_STAGE0_SHA256 }}
          NOESQL_NATIVE_BIN: ${{ runner.temp }}/native-approved/noesql-native
          NOESQL_NATIVE_BIN_SHA256: ${{ vars.NOESQL_NATIVE_BIN_SHA256 }}
          NOQERI_NATIVE_COMPILER: ${{ runner.temp }}/native-approved/noqeri-native-compiler
          NOQERI_NATIVE_COMPILER_SHA256: ${{ vars.NOQERI_NATIVE_COMPILER_SHA256 }}
        run: npm run release:preflight
      - name: npm publish to next (OIDC)
        env:
          NOESQL_APPROVE_PUBLICATION: ${{ inputs.confirm }}
          NOESQL_APPROVED_COMMIT_SHA: ${{ inputs.reviewed_commit }}
          NOESQL_LICENSE_REVIEWED: ${{ vars.NOESQL_LICENSE_REVIEWED }}
          NOQERI_ROOT: ${{ github.workspace }}/.ci-noqeri
          NOQERI_COMMIT_SHA: ${{ vars.NOQERI_COMMIT_SHA }}
          NOQERI_SOURCE_CLOSURE_SHA256: ${{ vars.NOQERI_SOURCE_CLOSURE_SHA256 }}
          NOQERI_STAGE0: ${{ runner.temp }}/native-approved/noqeri-stage0
          NOQERI_STAGE0_SHA256: ${{ vars.NOQERI_STAGE0_SHA256 }}
          NOESQL_NATIVE_BIN: ${{ runner.temp }}/native-approved/noesql-native
          NOESQL_NATIVE_BIN_SHA256: ${{ vars.NOESQL_NATIVE_BIN_SHA256 }}
          NOQERI_NATIVE_COMPILER: ${{ runner.temp }}/native-approved/noqeri-native-compiler
          NOQERI_NATIVE_COMPILER_SHA256: ${{ vars.NOQERI_NATIVE_COMPILER_SHA256 }}
        run: npm publish --access public --tag next
